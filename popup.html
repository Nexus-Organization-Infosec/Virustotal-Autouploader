<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: system-ui, Segoe UI, sans-serif; width: 240px; margin: 0; padding: 16px; color: #1a1a1a; }
    h1 { font-size: 14px; margin: 0 0 14px; }
    .row { display: flex; align-items: center; justify-content: space-between; }
    .label { font-size: 14px; font-weight: 600; }
    /* toggle */
    .switch { position: relative; display: inline-block; width: 46px; height: 26px; }
    .switch input { display: none; }
    .slider { position: absolute; cursor: pointer; inset: 0; background: #ccc; border-radius: 26px; transition: .2s; }
    .slider:before { content: ""; position: absolute; height: 20px; width: 20px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: .2s; }
    input:checked + .slider { background: #16a34a; }
    input:checked + .slider:before { transform: translateX(20px); }
    .state { margin-top: 12px; font-size: 12px; color: #555; }
    a { display: inline-block; margin-top: 14px; font-size: 12px; color: #2563eb; cursor: pointer; }
  </style>
</head>
<body>
  <h1>VirusTotal Download Scanner</h1>
  <div class="row">
    <span class="label">Auto-scan downloads</span>
    <label class="switch">
      <input type="checkbox" id="enabled">
      <span class="slider"></span>
    </label>
  </div>
  <div class="state" id="state"></div>
  <a id="openSettings">Settings…</a>
  <script src="popup.js"></script>
</body>
</html>
